# =====================================================================
#  Скилл статей - конфиг проекта «Без-Дна» (bez-dna-sound)
# =====================================================================

project:
  # Домен проекта
  domain: "bez-dna-sound.lovable.app"
  # Путь к разделу со статьями
  content_path: ""

audience:
  # Портрет читателя
  profile: >
    Люди, переживающие хронический стресс, размытый фокус, потерю личных границ,
    фоновую тревогу и внутреннее выгорание. Они устали от попыток «заставить себя»
    и бороться со своим состоянием логикой. Ищут бережное, точечное и
    глубинное восстановление нервной системы через звуковые протоколы и работу с состоянием.
  # low = читатель ищет конкретное решение/действие без сложного академического жаргона
  jargon_level: "low"

voice:
  # Папка с образцами текстов для тон-матчинга
  source: "./voice-samples"
  forbidden:
    - "в современном мире"
    - "не секрет, что"
    - "давайте разберемся"
    - "как мы знаем"
    - "является ключевым фактором"
    - "в заключение хочется сказать"

cta:
  # Оффер проекта
  offer: "Персональный звуковой протокол глубинной настройки под ваше состояние (Древо трансформации из 21 ступени)"
  url: "https://t.me/dna_sound_bot"

editorial:
  banned_words: []

cms:
  # Способ публикации: manual (сохранение готового .md файла в content/blog/ и data)
  adapter: "manual"

tools:
  originality:
    max_cosine: 0.60
    ngram_n: 5
    max_ngram: 0.30
  cadence:
    # Откалибровано по реальному корпусу проекта (базовый уровень ~10.6)
    max_per_1k: 12.0
  read_aloud:
    max_sentence_words: 35
  structure:
    min_internal_links: 1

image:
  tool: ""
  format: "webp"
  dest: "./public/images/blog"
  ratio: "16:9"
  max_kb: 200
