name: Publish Article to VK

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug статьи (из content/blog или published). Если пусто — публикует последние изменения.'
        required: false
        default: ''
      target:
        description: 'Куда публиковать (community, both, user)'
        required: false
        default: 'community'
        type: choice
        options:
          - community
          - both
          - user
      attach_mode:
        description: 'Режим обложки: snippet (интерактивный переход на сайт) или photo (картинка ВК)'
        required: false
        default: 'snippet'
        type: choice
        options:
          - snippet
          - photo
  push:
    branches:
      - main
    paths:
      - 'content/blog/**'

jobs:
  publish:
    name: Publish to VK (Community / User Wall)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pillow

      - name: Publish post to VK
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: '242296287'
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_USER_ID: ${{ secrets.VK_USER_ID || '169786955' }}
          INPUT_SLUG: ${{ github.event.inputs.slug }}
          INPUT_TARGET: ${{ github.event.inputs.target || 'community' }}
          INPUT_ATTACH_MODE: ${{ github.event.inputs.attach_mode || 'snippet' }}
        run: |
          if [ -n "$INPUT_SLUG" ]; then
            echo "→ Ручной запуск публикации статьи: $INPUT_SLUG (цель: $INPUT_TARGET, режим: $INPUT_ATTACH_MODE)"
            python statejnik/tools/publish_to_vk.py --slug "$INPUT_SLUG" --target "$INPUT_TARGET" --attach-mode "$INPUT_ATTACH_MODE"
          else
            echo "→ Автоматический поиск измененных статей в content/blog/..."
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '^content/blog/.*\.md$' || true)
            if [ -z "$CHANGED_FILES" ]; then
              echo "ℹ️ Изменений в файлах статей не обнаружено."
              exit 0
            fi
            for file in $CHANGED_FILES; do
              slug=$(basename "$file" .md)
              echo "→ Автопубликация статьи в ВК: $slug (цель: $INPUT_TARGET, режим: $INPUT_ATTACH_MODE)"
              python statejnik/tools/publish_to_vk.py --slug "$slug" --target "$INPUT_TARGET" --attach-mode "$INPUT_ATTACH_MODE"
            done
          fi
