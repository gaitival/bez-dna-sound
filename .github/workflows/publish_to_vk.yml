name: Publish Article to VK

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug статьи (из content/blog или published). Если пусто — публикует последние изменения.'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'content/blog/**'

jobs:
  publish:
    name: Publish to VK Community Wall
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pillow

      - name: Publish post to VK
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: '242296287'
          INPUT_SLUG: ${{ github.event.inputs.slug }}
        run: |
          if [ -n "$INPUT_SLUG" ]; then
            echo "→ Ручной запуск публикации статьи: $INPUT_SLUG"
            python statejnik/tools/publish_to_vk.py --slug "$INPUT_SLUG"
          else
            echo "→ Автоматический поиск измененных статей в content/blog/..."
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '^content/blog/.*\.md$' || true)
            if [ -z "$CHANGED_FILES" ]; then
              echo "ℹ️ Изменений в файлах статей не обнаружено."
              exit 0
            fi
            for file in $CHANGED_FILES; do
              slug=$(basename "$file" .md)
              echo "→ Автопубликация статьи в ВК: $slug"
              python statejnik/tools/publish_to_vk.py --slug "$slug"
            done
          fi
