name: Publish Article to VK

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug статьи (из content/blog или published)'
        required: true
        default: 'zavyazano-razvyazano-kak-razorvat-uzel-ozhidanij-i-vernut-volyu'

jobs:
  publish:
    name: Publish to VK Community Wall
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pillow

      - name: Publish post to VK
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID || '242296287' }}
        run: |
          python statejnik/tools/publish_to_vk.py --slug "${{ github.event.inputs.slug }}"
