# statejnik.yaml - конфиг проекта «Без-Дна» (bez-dna-sound)
# Актуализирован под Статейник v1.2.0

project:
  name: "Без-Дна"
  domain: "bez-dna-sound.com"
  content_path: "/blog"
  region: "Россия"
  brands: ["Без-Дна", "bez-dna-sound"]

audience:
  profile: |
    Люди, переживающие хронический стресс, размытый фокус, потерю личных границ,
    фоновую тревогу и внутреннее выгорание. Они устали от попыток «заставить себя»
    и бороться со своим состоянием логикой. Ищут бережное, точечное и
    глубинное восстановление нервной системы через звуковые протоколы и работу с состоянием.
  jargon_level: "low"

voice:
  person: "мы"
  address: "вы"
  source: "./voice-samples"
  forbidden:
    - "в современном мире"
    - "не секрет, что"
    - "давайте разберемся"
    - "как мы знаем"
    - "является ключевым фактором"
    - "в заключение хочется сказать"

cta:
  offer: "Персональный звуковой протокол глубинной настройки под ваше состояние (Древо трансформации из 21 ступени)"
  url: "https://t.me/dna_sound_bot"

visuals:
  mode: unconfigured
  text_only_approval: ""
  generator: ""
  processor: ""
  reviewer: ""
  delivery: "files"
  budget: "0"
  max_attempts: 2

materials:
  video_sources: []
  cta_sources: []

editorial:
  banned_words: []
  notes: |
    Психологическая, звуковая и традиционная тематика:
    1. Запрет псевдонауки и выдуманных терминов (нейросоматика навязанных обязательств, размытый контур, акустическое распускание, фазовая связь, суббас тазового дна, 70% энергии ЦНС).
    2. Разграничивать фольклор/поверья (Валенцова, Майков, Топорков, Агапкина) и авторскую звуковую практику. Не называть обряды «древними законами».
    3. Отказ от шаблонной схемы: никаких «3 ловушки / 3 шага / 250 звёзд». Строить статьи вокруг уникальной истории, символа или житейского парадокса.
    4. Обряд должен содержать понятные символические действия с предметами (зеркало, ключ, нить) и словами (шепоток, замок «Ключ. Замок»).
    5. Продукт — это авторская звуковая практика и осознанный энергообмен, а не лечебная медицинская технология.
    6. Финал — сильная мысль или открытый вопрос, без ценников («250 звёзд») и кричащих призывов в лоб.

seo:
  seeds:
    - "звуковые протоколы для сна"
    - "восстановление нервной системы"
    - "хронический стресс как снять"
    - "глубинное расслабление"
  regions: [225]
  competitors: []

publish:
  auto: false
  default: files
  targets:
    files:
      type: manual
      dir: content/blog

report:
  channel: chat

tools:
  originality:
    max_cosine: 0.60
    max_ngram: 0.30
    ngram_n: 5
  cadence:
    max_per_1k: 12.0
  read_aloud:
    max_sentence_words: 35
    max_word_len: 17
    max_consonant_run: 5
  structure:
    min_internal_links: 1
